<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:UB;src:url(file:///root/.fonts/Unbounded-Black.ttf);font-weight:900}
@font-face{font-family:UE;src:url(file:///root/.fonts/Unbounded-ExtraBold.ttf);font-weight:800}
html,body{margin:0;background:transparent}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const c = document.getElementById('c'), g = c.getContext('2d');
const RED = '#F0292F', DRED = '#B3141C';
const logo = new Image(); logo.src = '../assets/logo.png';
let T = null; // timeline, injected

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = x => { x = clamp(x); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const inWin = (t, a, b) => t >= a && t < b;
// fade envelope: in over fi, out over fo
const env = (t, a, b, fi = 0.2, fo = 0.2) => clamp((t - a) / fi) * clamp((b - t) / fo);

function rrect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function text(s, x, y, size, color, font = 'UB', align = 'center', stroke = 0) {
  g.font = `${font === 'UB' ? 900 : 800} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = stroke; g.strokeStyle = 'rgba(0,0,0,0.85)'; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y);
}
function pop(s, x, y, size, color, t0, t, font = 'UB', stroke = 0) {
  const k = easeBack((t - t0) / 0.25); if (t < t0) return;
  g.save(); g.translate(x, y); g.scale(k, k); g.globalAlpha *= clamp((t - t0) / 0.08);
  text(s, 0, 0, size, color, font, 'center', stroke); g.restore();
}
function labelBox(s, x, y, t0, t, size = 46) {
  if (t < t0) return;
  const k = easeBack((t - t0) / 0.28);
  g.save(); g.translate(x, y); g.scale(k, k);
  g.font = `900 ${size}px UB`; const w = g.measureText(s).width + 56, h = size + 38;
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 24; g.fillStyle = RED; rrect(-w / 2, -h / 2, w, h, 18); g.fill();
  g.shadowBlur = 0; text(s, 0, 2, size, '#fff'); g.restore();
}

// ---------- light-leak flash ----------
function drawFlash(t) {
  for (const tc of T.flashes) {
    const d = (t - tc) / 0.24; if (Math.abs(d) >= 1) continue;
    const a = 1 - Math.abs(d);
    g.save();
    const gr = g.createLinearGradient(0, H, W, 0);
    gr.addColorStop(0, 'rgba(255,58,26,1)'); gr.addColorStop(0.55, 'rgba(255,140,40,1)'); gr.addColorStop(1, 'rgba(255,214,70,1)');
    g.globalAlpha = Math.min(1, a * 1.1) * 0.85; g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.globalAlpha = clamp((a - 0.45) * 2.2); g.fillStyle = '#fff8ee'; g.fillRect(0, 0, W, H);
    g.restore();
  }
}

// ---------- question: subscriber's message card, read along word by word ----------
// Like a screenshot of the client's message (clean frosted card, system font), but alive:
// it rises in like a notification, words turn from grey to black as the master reads them,
// key facts get a red marker, and the card flies off on the flash into the answer.
let CARD = null; // layout cache
function layoutCard() {
  const x = 50, w = 980, pad = 44, size = 40, lh = 56, maxW = w - pad * 2;
  g.font = `500 ${size}px Inter`;
  const sp = g.measureText(' ').width;
  let cx = 0, line = 0; const items = [];
  for (const [t, wd, key] of T.card.words) {
    const ww = g.measureText(wd).width;
    if (cx > 0 && cx + ww > maxW) { cx = 0; line++; }
    items.push({ t, wd, key, x: cx, line, w: ww }); cx += ww + sp;
  }
  const lines = line + 1, head = 112, foot = 112;
  const h = head + lines * lh + foot;
  const y = 1640 - h;
  CARD = { x, y, w, h, pad, size, lh, head, items };
}
function drawCard(t) {
  const { a, b } = T.card; if (t < a || t >= b + 0.35) return;
  if (!CARD) layoutCard();
  const { x, y, w, h, pad, size, lh, head, items } = CARD;
  const kin = easeOut((t - a) / 0.5);
  const kout = easeOut((t - b + 0.05) / 0.3);         // flies up and fades on the flash
  g.save();
  g.globalAlpha = clamp((t - a) / 0.25) * (1 - kout);
  g.translate(0, (1 - kin) * 140 - kout * 260);
  const sc = 0.94 + 0.06 * kin; g.translate(W / 2, y + h / 2); g.scale(sc, sc); g.translate(-W / 2, -(y + h / 2));
  // frosted card
  g.shadowColor = 'rgba(0,0,0,0.28)'; g.shadowBlur = 50; g.shadowOffsetY = 14;
  g.fillStyle = 'rgba(246,246,248,0.94)'; rrect(x, y, w, h, 44); g.fill();
  g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 2; rrect(x + 1, y + 1, w - 2, h - 2, 43); g.stroke();
  // header: avatar, name, time
  const av = g.createLinearGradient(x + pad, y + 30, x + pad + 64, y + 94); av.addColorStop(0, '#c9ccd3'); av.addColorStop(1, '#9ea3ad');
  g.fillStyle = av; g.beginPath(); g.arc(x + pad + 32, y + 62, 32, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x + pad + 32, y + 52, 11, 0, 7); g.fill();
  g.beginPath(); g.ellipse(x + pad + 32, y + 82, 19, 12, 0, Math.PI, 0); g.fill();
  g.font = '600 32px Inter'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#1c1c1e';
  g.fillText('Вопрос подписчика', x + pad + 84, y + 50);
  g.font = '400 26px Inter'; g.fillStyle = '#8e8e93'; g.fillText('сообщение · сейчас', x + pad + 84, y + 84);
  // body: read-along
  g.font = `500 ${size}px Inter`;
  for (const it of items) {
    const px = x + pad + it.x, py = y + head + it.line * lh + lh / 2;
    const r = clamp((t - it.t + 0.04) / 0.16);
    if (it.key && r > 0) {             // red marker sweeps under key words
      const mk = easeOut((t - it.t) / 0.25);
      g.fillStyle = 'rgba(240,41,47,0.18)'; rrect(px - 6, py - 26, (it.w + 12) * mk, 52, 10); g.fill();
    }
    const grey = 168 - 140 * r;
    g.fillStyle = it.key && r > 0 ? `rgb(${Math.round(150 + 90 * r)},${Math.round(grey * (1 - r) + 30 * r)},${Math.round(grey * (1 - r) + 36 * r)})`
                                  : `rgb(${grey},${grey},${grey + 4})`;
    g.fillText(it.wd, px, py + 2);
  }
  // reply row like in the app
  const ry = y + h - 84;
  g.fillStyle = '#e5e5ea'; rrect(x + pad, ry, w - pad * 2 - 90, 60, 30); g.fill();
  g.font = '400 28px Inter'; g.fillStyle = '#8e8e93'; g.fillText('Ответить…', x + pad + 28, ry + 32);
  g.fillStyle = RED; g.beginPath(); g.arc(x + w - pad - 32, ry + 30, 30, 0, 7); g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 6; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x + w - pad - 32, ry + 44); g.lineTo(x + w - pad - 32, ry + 16); g.moveTo(x + w - pad - 44, ry + 28); g.lineTo(x + w - pad - 32, ry + 16); g.lineTo(x + w - pad - 20, ry + 28); g.stroke();
  g.restore();
}

// ---------- hydraulic block (pseudo-3D), reused by the leak scheme and the clogged block ----------
const CH = [
  [[180, 520], [420, 520], [420, 640], [900, 640]],
  [[180, 760], [560, 760], [560, 880], [900, 880]],
  [[300, 520], [300, 940]],
  [[700, 640], [700, 880]],
];
function polyline(pts) { g.beginPath(); g.moveTo(...pts[0]); for (const p of pts.slice(1)) g.lineTo(...p); }
function ptOn(pts, u) { // point at fraction u along a polyline
  let L = 0; const seg = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
  let s = u * L; for (let i = 1; i < pts.length; i++) { if (s <= seg[i - 1]) { const f = s / seg[i - 1]; return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f]; } s -= seg[i - 1]; }
  return pts[pts.length - 1];
}
const rnd = n => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };
function block(t, lt, leak, clog) {
  const bx = 120, by = 420, bw = 840, bh = 600, dep = 30;
  g.fillStyle = '#3a3f47'; g.beginPath(); g.moveTo(bx + bw, by + 20); g.lineTo(bx + bw + dep, by + 20 + dep); g.lineTo(bx + bw + dep, by + bh + dep); g.lineTo(bx + 20 + dep, by + bh + dep); g.lineTo(bx + 20, by + bh); g.lineTo(bx + bw, by + bh); g.closePath(); g.fill();
  g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = 50;
  const mg = g.createLinearGradient(bx, by, bx + bw, by + bh); mg.addColorStop(0, '#e9ecf0'); mg.addColorStop(0.45, '#a4abb4'); mg.addColorStop(1, '#5d646d');
  g.fillStyle = mg; rrect(bx, by, bw, bh, 22); g.fill(); g.shadowBlur = 0;
  g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 3; g.beginPath(); g.moveTo(bx + 22, by + 2); g.lineTo(bx + bw - 22, by + 2); g.stroke();
  for (const [hx, hy] of [[160, 460], [920, 460], [160, 980], [920, 980], [540, 980]]) {
    const hg = g.createRadialGradient(hx - 4, hy - 4, 2, hx, hy, 18); hg.addColorStop(0, '#20232a'); hg.addColorStop(1, '#6b727c');
    g.fillStyle = hg; g.beginPath(); g.arc(hx, hy, 16, 0, 7); g.fill();
  }
  const flow = (1 - 0.8 * leak) * (1 - 0.9 * clog);
  for (const ch of CH) { polyline(ch); g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 40; g.strokeStyle = '#2b2f36'; g.stroke(); }
  for (const ch of CH) {
    polyline(ch); g.lineWidth = 22; g.strokeStyle = `rgba(255,${150 - 60 * leak - 60 * clog},40,${0.95 - 0.35 * leak - 0.3 * clog})`; g.stroke();
    polyline(ch); g.setLineDash([22, 26]); g.lineDashOffset = -lt * 260 * flow; g.lineWidth = 10; g.strokeStyle = `rgba(255,236,170,${0.9 - 0.6 * clog})`; g.stroke(); g.setLineDash([]);
  }
  if (clog > 0) { // wear particles pile up in the channels
    CH.forEach((ch, ci) => { for (let i = 0; i < 26; i++) {
      const u = rnd(ci * 50 + i); if (rnd(ci * 50 + i + 7) > clog) continue;
      const [px, py] = ptOn(ch, u), jx = (rnd(i + 3) - 0.5) * 16, jy = (rnd(i + 9) - 0.5) * 16;
      g.fillStyle = `rgba(${30 + rnd(i) * 40},${28 + rnd(i) * 30},${26},0.95)`; g.beginPath(); g.arc(px + jx, py + jy, 5 + rnd(i + 1) * 7, 0, 7); g.fill();
      g.fillStyle = 'rgba(200,200,200,0.35)'; g.beginPath(); g.arc(px + jx - 2, py + jy - 2, 2, 0, 7); g.fill();
    } });
  }
  [[230, 640], [640, 520], [820, 760]].forEach(([vx, vy], i) => {
    const off = Math.sin(lt * 3 + i) * 10 * (1 - leak) * (1 - clog) + (clog > 0.5 ? Math.sin(t * 60 + i) * 2 : 0);
    const vg = g.createLinearGradient(0, vy - 26, 0, vy + 26); vg.addColorStop(0, '#f4f6f8'); vg.addColorStop(0.5, '#9aa1aa'); vg.addColorStop(1, '#474d55');
    g.fillStyle = '#1d2026'; rrect(vx - 90, vy - 34, 180, 68, 30); g.fill();
    g.fillStyle = vg; rrect(vx - 70 + off, vy - 24, 140, 48, 22); g.fill();
    g.fillStyle = 'rgba(40,44,50,0.6)'; g.fillRect(vx - 20 + off, vy - 24, 10, 48); g.fillRect(vx + 22 + off, vy - 24, 10, 48);
    if (clog > 0.6) { g.strokeStyle = `rgba(240,41,47,${(clog - 0.6) * 2.5 * (0.6 + 0.4 * Math.sin(t * 20))})`; g.lineWidth = 6; rrect(vx - 96, vy - 40, 192, 80, 34); g.stroke(); }
  });
  const lx = 700, ly = 760;
  g.lineWidth = 10; g.strokeStyle = '#e8e2d0'; g.beginPath(); g.arc(lx, ly, 34, 0, 7); g.stroke();
  if (leak > 0) {
    g.strokeStyle = `rgba(240,41,47,${0.6 + 0.4 * Math.sin(t * 30)})`; g.lineWidth = 12; g.shadowColor = RED; g.shadowBlur = 30;
    g.beginPath(); g.arc(lx, ly, 52 + 6 * Math.sin(t * 20), 0, 7); g.stroke(); g.shadowBlur = 0;
    for (let i = 0; i < 22; i++) {
      const life = ((t - T.scheme[2]) * 1.6 + rnd(i)) % 1, ang = -0.5 + rnd(i + 7) * 1.0;
      const dx = Math.cos(ang) * 260 * life, dy = Math.sin(ang) * 120 * life + 380 * life * life;
      g.fillStyle = `rgba(255,${150 + rnd(i) * 60},40,${(1 - life) * leak})`;
      g.beginPath(); g.ellipse(lx + 40 + dx, ly + dy, 9, 13, 0, 0, 7); g.fill();
    }
  }
}
function darkBg() {
  const bg = g.createRadialGradient(W / 2, 700, 100, W / 2, 900, 1300);
  bg.addColorStop(0, '#24262c'); bg.addColorStop(1, '#0a0a0c'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,0.04)'; g.lineWidth = 2;
  for (let x = 0; x < W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
}
// block is drawn in its own 1080x(420..1050) space; place(cx, cy, s) maps its centre (540,735)
function place(cx, cy, s) { g.translate(cx, cy); g.scale(s, s); g.translate(-540, -735); }

// ---------- leak scheme: everything compact in the upper part, gauge + ECU in one row ----------
function drawScheme(t) {
  const [a, b, leakT, ecuT] = T.scheme; if (!inWin(t, a, b)) return;
  const lt = t - a, e = clamp((b - t) / 0.15), k = easeOut(lt / 0.4);
  const leak = clamp((t - leakT) / 0.6);
  g.save(); darkBg(); g.globalAlpha = e;
  text('ГИДРОБЛОК', W / 2, 250, 40, 'rgba(255,255,255,0.55)', 'UE');
  const shake = leak > 0 ? Math.sin(t * 80) * 3 * leak : 0;
  g.save(); g.globalAlpha = e * k; g.translate(shake, (1 - k) * 80); place(540, 590, 0.86); block(t, lt, leak, 0); g.restore();
  if (leak > 0) { g.save(); g.globalAlpha = e; labelBox('УТЕЧКА ДАВЛЕНИЯ', W / 2, 920, leakT, t, 46); g.restore(); }
  const rowY = 1150;
  const gx = 320, gy = rowY, gr = 130;
  g.save(); g.globalAlpha = e * k;
  g.lineWidth = 22; g.lineCap = 'butt';
  const a0 = Math.PI * 0.8, a1 = Math.PI * 2.2;
  g.strokeStyle = '#2e3138'; g.beginPath(); g.arc(gx, gy, gr, a0, a1); g.stroke();
  g.strokeStyle = RED; g.beginPath(); g.arc(gx, gy, gr, a0, a0 + (a1 - a0) * 0.25); g.stroke();
  g.strokeStyle = '#3ecf6e'; g.beginPath(); g.arc(gx, gy, gr, a0 + (a1 - a0) * 0.55, a1); g.stroke();
  const val = 0.85 - 0.72 * easeOut((t - leakT) / 1.2) + (t > leakT ? Math.sin(t * 50) * 0.02 : 0);
  const na = a0 + (a1 - a0) * val;
  g.strokeStyle = '#fff'; g.lineWidth = 8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + Math.cos(na) * (gr - 26), gy + Math.sin(na) * (gr - 26)); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(gx, gy, 13, 0, 7); g.fill();
  text('ДАВЛЕНИЕ', gx, gy + 165, 28, 'rgba(255,255,255,0.8)', 'UE');
  const cx = 760, cy = rowY, cs = 170;
  g.strokeStyle = '#9aa1aa'; g.lineWidth = 8; g.lineCap = 'butt';
  for (let i = 0; i < 5; i++) { const o = -cs / 2 + 22 + i * (cs - 44) / 4;
    g.beginPath(); g.moveTo(cx - cs / 2 - 24, cy + o); g.lineTo(cx - cs / 2, cy + o); g.moveTo(cx + cs / 2, cy + o); g.lineTo(cx + cs / 2 + 24, cy + o);
    g.moveTo(cx + o, cy - cs / 2 - 24); g.lineTo(cx + o, cy - cs / 2); g.moveTo(cx + o, cy + cs / 2); g.lineTo(cx + o, cy + cs / 2 + 24); g.stroke(); }
  const cg = g.createLinearGradient(cx - cs / 2, cy - cs / 2, cx + cs / 2, cy + cs / 2); cg.addColorStop(0, '#3a3f47'); cg.addColorStop(1, '#16181c');
  g.fillStyle = cg; rrect(cx - cs / 2, cy - cs / 2, cs, cs, 18); g.fill();
  const alarm = t >= ecuT && Math.floor((t - ecuT) * 5) % 2 === 0;
  g.strokeStyle = alarm ? RED : 'rgba(255,255,255,0.25)'; g.lineWidth = 6; rrect(cx - cs / 2 + 14, cy - cs / 2 + 14, cs - 28, cs - 28, 12); g.stroke();
  if (t >= ecuT) { g.shadowColor = RED; g.shadowBlur = alarm ? 40 : 10; text('!', cx, cy + 4, 100, alarm ? RED : '#ff8a8d'); g.shadowBlur = 0; }
  else text('ЭБУ', cx, cy + 2, 38, 'rgba(255,255,255,0.7)', 'UE');
  text('БЛОК УПРАВЛЕНИЯ', cx, gy + 165, 28, 'rgba(255,255,255,0.8)', 'UE');
  g.restore();
  if (t >= ecuT) { g.save(); g.globalAlpha = e; labelBox('АВАРИЙНЫЙ РЕЖИМ', W / 2, 1400, ecuT + 0.1, t, 40); g.restore(); }
  g.restore();
}

// ---------- cause 1: teflon sealing ring pinched in its groove ----------
function drawRing(t) {
  const [a, b, pinchT] = T.ring; if (!inWin(t, a, b)) return;
  const lt = t - a, e = clamp((b - t) / 0.15), k = easeOut(lt / 0.4);
  g.save(); darkBg(); g.globalAlpha = e * k; g.translate(0, (1 - k) * 60);
  const cy = 800, r = 120, gx = 560;               // shaft axis y, radius, groove x
  // shaft (cylinder seen from the side)
  const sg = g.createLinearGradient(0, cy - r, 0, cy + r);
  sg.addColorStop(0, '#5d646d'); sg.addColorStop(0.18, '#eef1f4'); sg.addColorStop(0.45, '#a9b0b9'); sg.addColorStop(1, '#3c4148');
  g.fillStyle = sg; g.fillRect(-20, cy - r, W + 40, 2 * r);
  // groove
  const gw = 64; const gg = g.createLinearGradient(0, cy - r, 0, cy + r); gg.addColorStop(0, '#2a2e34'); gg.addColorStop(0.3, '#6d747d'); gg.addColorStop(1, '#1d2025');
  g.fillStyle = gg; g.fillRect(gx - gw / 2, cy - r + 14, gw, 2 * r - 28);
  // teflon ring slides into the groove
  const slide = easeOut(lt / 0.6), rx = gx - (1 - slide) * 420;
  const rg = g.createLinearGradient(0, cy - r - 10, 0, cy + r + 10); rg.addColorStop(0, '#bfb6a0'); rg.addColorStop(0.2, '#fbf6ea'); rg.addColorStop(0.5, '#e4dccb'); rg.addColorStop(1, '#8e8674');
  g.fillStyle = rg; rrect(rx - 26, cy - r - 10, 52, 2 * r + 20, 12); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(rx - 18, cy - r - 6, 6, 2 * r + 12);
  text('ТЕФЛОНОВОЕ КОЛЬЦО', W / 2, 1010, 38, 'rgba(255,255,255,0.75)', 'UE');
  // pinch: the ring is bitten at the edge of the groove, oil escapes
  const p = clamp((t - pinchT) / 0.3);
  if (p > 0) {
    g.fillStyle = '#7a7364'; g.beginPath(); g.moveTo(rx + 26, cy - r - 10); g.lineTo(rx + 52 * p, cy - r + 30); g.lineTo(rx + 26, cy - r + 60); g.closePath(); g.fill();
    for (let i = 0; i < 14; i++) {
      const life = ((t - pinchT) * 1.5 + rnd(i)) % 1;
      g.fillStyle = `rgba(255,${150 + rnd(i) * 60},40,${(1 - life) * p})`;
      g.beginPath(); g.ellipse(rx + 60 + life * (120 + rnd(i + 2) * 120), cy - r + 20 - life * 140 + life * life * 260, 8, 11, 0, 0, 7); g.fill();
    }
    const q = easeOut((t - pinchT) / 0.45);
    g.save(); g.strokeStyle = RED; g.lineWidth = 12; g.lineCap = 'round'; g.shadowColor = 'rgba(240,41,47,0.9)'; g.shadowBlur = 26;
    g.beginPath(); g.ellipse(rx + 20, cy - r + 20, 120, 90, -0.2, -Math.PI / 2, -Math.PI / 2 + q * Math.PI * 2.05); g.stroke(); g.restore();
    labelBox('ЗАКУСИЛИ', rx + 20, cy - r - 150, pinchT + 0.15, t, 48);
  }
  g.restore();
}

// ---------- cause 2: external oil cooler installed wrong ----------
function drawCooler(t) {
  const [a, b, badT] = T.cooler; if (!inWin(t, a, b)) return;
  const lt = t - a, e = clamp((b - t) / 0.15), k = easeOut(lt / 0.4);
  const bad = clamp((t - badT) / 0.3);
  g.save(); darkBg(); g.globalAlpha = e * k; g.translate(0, (1 - k) * 60);

// ---------- cause 3: valve body clogged with wear particles ----------
function drawClog(t) {

// ---------- three possible causes: list on top + corner brackets on the b-roll ----------

    g.fillStyle = cur ? RED : '#5a5e66'; g.beginPath(); g.arc(x + 46, y, 34, 0, 7); g.fill();
    text(String(i + 1), x + 46, y + 2, 40, '#fff'); text(REASONS[i], x + 100, y + 2, 38, '#fff', 'UB', 'left');

}
