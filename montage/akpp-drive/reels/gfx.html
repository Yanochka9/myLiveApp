<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:UB;src:url(file:///root/.fonts/Unbounded-Black.ttf);font-weight:900}
@font-face{font-family:UE;src:url(file:///root/.fonts/Unbounded-ExtraBold.ttf);font-weight:800}
html,body{margin:0;background:transparent}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Event-driven gfx for AKPP Drive reels. Timeline: {fps,total,main,hook_end,ev:[{type,...}],end_q:[...]}
const W = 1080, H = 1920;
const c = document.getElementById('c'), g = c.getContext('2d');
const RED = '#F0292F', DRED = '#B3141C', GREEN = '#3ecf6e';
const logo = new Image();
let T = null;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 2);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeBack = x => { x = clamp(x); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const inWin = (t, a, b) => t >= a && t < b;
const env = (t, a, b, fi = 0.2, fo = 0.2) => clamp((t - a) / fi) * clamp((b - t) / fo);

function rrect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function text(s, x, y, size, color, font = 'UB', align = 'center', stroke = 0) {
  g.font = `${font === 'UB' ? 900 : 800} ${size}px ${font}`; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = stroke; g.strokeStyle = 'rgba(0,0,0,0.85)'; g.strokeText(s, x, y); }
  g.fillStyle = color; g.fillText(s, x, y);
}
function pop(s, x, y, size, color, t0, t, font = 'UB', stroke = 0) {
  if (t < t0) return; const k = easeBack((t - t0) / 0.25);
  g.save(); g.translate(x, y); g.scale(k, k); g.globalAlpha *= clamp((t - t0) / 0.08);
  text(s, 0, 0, size, color, font, 'center', stroke); g.restore();
}
function plate(s, x, y, t0, t, size = 46, bg = RED, fg = '#fff', o = {}) {
  // extruded "3D" plate: darker slab under the face, glossy gradient face, top highlight, shine sweep, flip-in
  if (t < t0) return;
  const lt = t - t0, k = easeBack(lt / 0.34), fl = easeOut(lt / 0.3);
  g.save(); g.translate(x, y + (1 - fl) * 26); g.rotate(o.tilt ?? -0.025); g.scale(k, k * (0.35 + 0.65 * fl));
  g.font = `900 ${size}px UB`;
  if (g.measureText(s).width + 70 > 680) { size = Math.floor(size * 610 / g.measureText(s).width); g.font = `900 ${size}px UB`; }
  const w = g.measureText(s).width + 70, h = size + 40, r = Math.min(22, h / 2), dep = 9;
  const dark = bg === RED ? '#7d0b10' : (o.dark || '#0b0b0d');
  g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 8; g.shadowOffsetY = 4;
  g.fillStyle = dark; rrect(-w / 2, -h / 2 + dep, w, h, r); g.fill();           // slab (depth)
  g.shadowBlur = 0; g.shadowOffsetY = 0;
  const gr = g.createLinearGradient(0, -h / 2, 0, h / 2);
  if (bg === RED) { gr.addColorStop(0, '#ff5a5f'); gr.addColorStop(0.55, RED); gr.addColorStop(1, '#c4121a'); }
  else { gr.addColorStop(0, o.top || '#3a3e47'); gr.addColorStop(1, bg); }
  g.fillStyle = gr; rrect(-w / 2, -h / 2, w, h, r); g.fill();                    // face
  g.save(); rrect(-w / 2, -h / 2, w, h, r); g.clip();
  g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(-w / 2, -h / 2, w, 3);      // top highlight
  const sp = clamp((lt - 0.25) / 0.55);
  if (sp > 0 && sp < 1) { const sx = -w / 2 - 90 + (w + 180) * sp, sg = g.createLinearGradient(sx - 50, 0, sx + 50, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.45)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sg; g.fillRect(-w / 2, -h / 2, w, h); }
  g.restore();
  g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,0.28)'; rrect(-w / 2, -h / 2, w, h, r); g.stroke();
  g.shadowColor = 'rgba(0,0,0,0.35)'; g.shadowBlur = 6; text(s, 0, 2, size, fg); g.restore();
}
function labelBox(s, x, y, t0, t, size = 46, bg = RED, fg = '#fff') { plate(s, x, y, t0, t, size, bg, fg); }

// ---------------- primitives ----------------
const D = {};
D.flash = (e, t) => {
  const d = (t - e.t) / 0.24; if (Math.abs(d) >= 1) return;
  const a = 1 - Math.abs(d);
  const gr = g.createLinearGradient(0, H, W, 0);
  gr.addColorStop(0, 'rgba(255,58,26,1)'); gr.addColorStop(0.55, 'rgba(255,140,40,1)'); gr.addColorStop(1, 'rgba(255,214,70,1)');
  g.save(); g.globalAlpha = Math.min(1, a * 1.1) * 0.85; g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.globalAlpha = clamp((a - 0.45) * 2.2); g.fillStyle = '#fff8ee'; g.fillRect(0, 0, W, H); g.restore();
};
D.header = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const en = env(t, e.t0, e.t1, 0.15, 0.2), y = e.y || 1150, size = e.size || 54;
  g.save(); g.globalAlpha = en;
  plate(e.text, W / 2, y, e.t0, t, size, RED, '#fff', { tilt: -0.03 });
  if (e.sub && t > e.t0 + 0.28) {
    const q = easeBack((t - e.t0 - 0.28) / 0.3);
    g.save(); g.translate(W / 2, y + size + 46); g.scale(q, q);
    g.font = '800 36px UE'; const w = Math.min(700, g.measureText(e.sub).width + 60), h = 62;
    g.fillStyle = 'rgba(14,14,18,0.82)'; rrect(-w / 2, -h / 2, w, h, h / 2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 2; rrect(-w / 2, -h / 2, w, h, h / 2); g.stroke();
    text(e.sub, 0, 2, 36, '#fff', 'UE'); g.restore();
  }
  g.restore();
};
D.label = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  g.save(); g.globalAlpha = clamp((e.t1 - t) / 0.12);
  labelBox(e.text, e.x || W / 2, e.y || 1050, e.t0, t, e.size || 50, e.bg || RED, e.fg || '#fff'); g.restore();
};
D.ellipse = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const p = easeOut((t - e.t0) / 0.45), en = clamp((e.t1 - t) / 0.12);
  let cy = e.cy;
  if (Array.isArray(cy)) { const k = cy, u = t - (e.kt0 ?? e.t0); let i = 0; while (i < k.length - 2 && u > k[i + 1][0]) i++;
    const f = clamp((u - k[i][0]) / (k[i + 1][0] - k[i][0])); cy = k[i][1] + (k[i + 1][1] - k[i][1]) * f; }
  g.save(); g.globalAlpha = en; g.translate(e.cx, cy); g.rotate(e.rot || 0);
  g.strokeStyle = e.color || RED; g.lineWidth = 12; g.lineCap = 'round'; g.shadowColor = 'rgba(240,41,47,0.9)'; g.shadowBlur = 26;
  g.beginPath(); g.ellipse(0, 0, e.rx, e.ry, 0, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2.05); g.stroke();
  g.restore();
  if (e.label && t >= e.lt) {
    if (e.line) {
      g.save(); g.globalAlpha = en; g.strokeStyle = '#fff'; g.lineWidth = 6; g.lineCap = 'round';
      const q = easeOut((t - e.lt) / 0.25), [x0, y0, x1, y1] = e.line;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + (x1 - x0) * q, y0 + (y1 - y0) * q); g.stroke(); g.restore();
    }
    g.save(); g.globalAlpha = en; labelBox(e.label, e.lx, e.ly, e.lt + 0.1, t, e.size || 54); g.restore();
  }
};
D.brackets = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const k = easeOut((t - e.t0) / 0.35), en = clamp((e.t1 - t) / 0.12);
  const [x0, y0, x1, y1] = e.box, L = e.L || 90, grow = (1 - k) * 70, col = e.color || RED;
  g.save(); g.globalAlpha = en * clamp((t - e.t0) / 0.1); g.strokeStyle = col; g.lineWidth = 11; g.lineCap = 'square';
  g.shadowColor = col; g.shadowBlur = 18;
  [[x0 - grow, y0 - grow, 1, 1], [x1 + grow, y0 - grow, -1, 1], [x0 - grow, y1 + grow, 1, -1], [x1 + grow, y1 + grow, -1, -1]].forEach(([x, y, sx, sy]) => {
    g.beginPath(); g.moveTo(x, y + sy * L); g.lineTo(x, y); g.lineTo(x + sx * L, y); g.stroke();
  });
  g.restore();
  if (e.label) { g.save(); g.globalAlpha = en; labelBox(e.label, e.lx || (x0 + x1) / 2, e.ly || y0 - 90, e.lt || e.t0 + 0.2, t, e.size || 48, e.bg || col); g.restore(); }
};
const fmtNum = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
D.counter = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const en = env(t, e.t0, e.t1, 0.15, 0.2);
  g.save(); g.globalAlpha = en;
  const y = e.y || 1490;

  const p = clamp((t - e.t0) / (e.hit - e.t0));
  let n = Math.round((e.from || 0) + (e.to - (e.from || 0)) * Math.pow(p, 0.8));
  if (e.step) n = Math.round(n / e.step) * e.step;
  const k = t < e.hit ? 1 : 1 + 0.25 * Math.max(0, 1 - (t - e.hit) / 0.18) * Math.sin(Math.min(1, (t - e.hit) / 0.18) * Math.PI);
  g.translate(W / 2, y); g.scale(k, k);
  g.shadowColor = 'rgba(240,41,47,0.7)'; g.shadowBlur = t >= e.hit ? 50 : 10;
  text((e.prefix || '') + fmtNum(n), 0, 0, e.size || 170, RED, 'UB', 'center', 14);
  g.restore();
  if (e.label) { g.save(); g.globalAlpha = en; pop(e.label, W / 2, y + (e.size || 170) * 0.75, 70, '#fff', e.lt || e.hit, t, 'UB', 10); g.restore(); }
};
D.interval = (e, t) => {   // old value crossed out -> new value
  if (!inWin(t, e.t0, e.t1)) return;
  const en = env(t, e.t0, e.t1, 0.15, 0.2), k = easeOut((t - e.t0) / 0.35);
  g.save(); g.globalAlpha = en; g.translate(0, (1 - k) * 80);
  const x = 160, y = e.y || 800, w = 760, h = 330;
  g.fillStyle = '#050506'; rrect(x, y + 10, w, h, 36); g.fill();
  const cg = g.createLinearGradient(0, y, 0, y + h); cg.addColorStop(0, 'rgba(40,42,50,0.95)'); cg.addColorStop(1, 'rgba(12,12,15,0.95)');
  g.fillStyle = cg; rrect(x, y, w, h, 36); g.fill();
  const bgr = g.createLinearGradient(x, y, x + w, y + h); bgr.addColorStop(0, RED); bgr.addColorStop(1, '#ffb02e');
  g.lineWidth = 4; g.strokeStyle = bgr; rrect(x + 2, y + 2, w - 4, h - 4, 34); g.stroke();
  text(e.title, W / 2, y + 58, 34, 'rgba(255,255,255,0.7)', 'UE');
  text(e.old, W / 2, y + 145, 58, 'rgba(255,255,255,0.85)', 'UB');
  if (t > e.tx) { // strike
    const q = easeOut((t - e.tx) / 0.25); g.strokeStyle = RED; g.lineWidth = 12; g.lineCap = 'round';
    g.font = '900 58px UB'; const tw = g.measureText(e.old).width;
    g.beginPath(); g.moveTo(W / 2 - tw / 2 - 20, y + 150); g.lineTo(W / 2 - tw / 2 - 20 + (tw + 40) * q, y + 140); g.stroke();
  }
  g.restore();
  g.save(); g.globalAlpha = en; pop(e.new, W / 2, (e.y || 800) + 245 + (1 - k) * 80, 62, GREEN, e.tn, t, 'UB', 0); g.restore();
};
D.address = (e, t) => {
  if (!inWin(t, e.t0, e.t1 + 0.01)) return;
  const k = easeOut((t - e.t0) / 0.4);
  g.save(); g.globalAlpha = clamp((t - e.t0) / 0.15); g.translate(0, (1 - k) * 12);
  const x = 160, y = e.y || 1225, w = 760, h = 160;
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 8; g.fillStyle = 'rgba(14,14,16,0.88)'; rrect(x, y, w, h, 30); g.fill();
  g.shadowBlur = 0; g.fillStyle = RED; rrect(x, y, 12, h, 6); g.fill();
  g.drawImage(logo, x + 30, y + 18, 124, 124);
  text('АКПП ДРАЙВ', x + 178, y + 58, 50, '#fff', 'UB', 'left');
  const px = x + 190, py = y + 112; g.fillStyle = RED; g.beginPath(); g.arc(px, py - 7, 13, Math.PI, 0); g.lineTo(px, py + 17); g.closePath(); g.fill();
  g.fillStyle = '#0e0e10'; g.beginPath(); g.arc(px, py - 7, 5, 0, 7); g.fill();
  text(e.text || 'Дзержинского, 82А', x + 216, py, 34, 'rgba(255,255,255,0.9)', 'UE', 'left');
  g.restore();
};
D.question = (e, t) => {  // subscriber question bubble (hook)
  if (!inWin(t, e.t0, e.t1)) return;
  const k = easeOut((t - e.t0) / 0.35), en = clamp((e.t1 - t) / 0.15);
  g.save(); g.globalAlpha = en; g.translate(W / 2, e.y || 300); g.scale(k, k);
  const w = 740, lines = e.lines, h = 110 + lines.length * 60;
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 8; g.fillStyle = '#ffffff'; rrect(-w / 2, -60, w, h, 40); g.fill();
  g.beginPath(); g.moveTo(-w / 2 + 90, h - 62); g.lineTo(-w / 2 + 60, h + 10); g.lineTo(-w / 2 + 170, h - 62); g.fill();
  g.shadowBlur = 0; g.fillStyle = RED; rrect(-w / 2 + 40, -34, 330, 56, 16); g.fill();
  text('ВОПРОС', -w / 2 + 205, -5, 32, '#fff', 'UB');
  lines.forEach((s, i) => text(s, -w / 2 + 40, 70 + i * 60, 40, '#111', 'UB', 'left'));
  g.restore();
};

// meme caption: big outlined text with a punch and a little shake
D.meme = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const k = easeBack((t - e.t0) / 0.22), sh = t - e.t0 < 0.5 ? Math.sin(t * 90) * 7 * (1 - (t - e.t0) / 0.5) : 0;
  g.save(); g.globalAlpha = clamp((e.t1 - t) / 0.08);
  g.translate(W / 2 + sh, e.y || 330); g.rotate(-0.05); g.scale(k, k);
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 30;
  text(e.text, 0, 0, e.size || 132, '#fff', 'UB', 'center', 22);
  g.shadowBlur = 0;
  if (e.sub) text(e.sub, 0, (e.size || 132) * 0.85, 54, '#FFD23A', 'UB', 'center', 12);
  g.restore();
};

// big extruded "3D" number with a glass caption: pops up, depth grows, a shine sweeps across, floats gently
D.big3d = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const lt = t - e.t0, en = clamp((e.t1 - t) / 0.15), k = easeBack(lt / 0.45), dep = easeOut((lt - 0.1) / 0.35);
  let size = e.size || 230; const y = e.y || 980, N = 22;
  g.font = `900 ${size}px UB`; { const w0 = g.measureText(e.text).width; if (w0 > 600) size = Math.floor(size * 600 / w0); }
  g.save(); g.globalAlpha = en * clamp(lt / 0.08);
  g.translate(W / 2, y + Math.sin(lt * 2.4) * 6); g.rotate(-0.06 + 0.02 * Math.sin(lt * 1.7));
  g.scale(k, k * (0.6 + 0.4 * easeOut(lt / 0.3)));
  g.font = `900 ${size}px UB`; g.textAlign = 'center'; g.textBaseline = 'middle';
  // soft floor shadow
  g.save(); g.globalAlpha *= 0.55; g.fillStyle = '#000'; g.filter = 'blur(18px)';
  g.beginPath(); g.ellipse(0, size * 0.62, g.measureText(e.text).width * 0.5, 26, 0, 0, 7); g.fill(); g.restore();
  // extrusion (back to front)
  for (let i = N; i >= 1; i--) {
    const q = i / N * dep, c = Math.round(70 + 90 * (1 - i / N));
    g.fillStyle = `rgb(${c + 40},${Math.round(c * 0.12)},${Math.round(c * 0.15)})`;
    g.fillText(e.text, q * 10, q * 14);
  }
  // front face: glossy red gradient
  const gr = g.createLinearGradient(0, -size * 0.5, 0, size * 0.5);
  gr.addColorStop(0, '#ff8a8d'); gr.addColorStop(0.45, RED); gr.addColorStop(1, '#a50f16');
  g.fillStyle = gr; g.fillText(e.text, 0, 0);
  g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,0.55)'; g.strokeText(e.text, 0, 0);
  // shine sweep clipped to the glyphs
  const sp = clamp((lt - 0.45) / 0.6);
  if (sp > 0 && sp < 1) {
    g.save(); g.globalCompositeOperation = 'source-atop';
    const tw = g.measureText(e.text).width, sx = -tw / 2 - 120 + (tw + 240) * sp;
    const sg = g.createLinearGradient(sx - 60, 0, sx + 60, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.85)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sg; g.fillText(e.text, 0, 0); g.restore();
  }
  g.restore();
  if (e.sub && lt > 0.3) {   // glass caption under the number
    const q = easeBack((lt - 0.3) / 0.3);
    g.save(); g.globalAlpha = en; g.translate(W / 2, y + size * 0.78); g.scale(q, q);
    g.font = `900 ${e.subsize || 44}px UB`; const w = Math.min(760, g.measureText(e.sub).width + 64), h = (e.subsize || 44) + 36;
    g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 24; g.fillStyle = 'rgba(16,16,20,0.78)'; rrect(-w / 2, -h / 2, w, h, h / 2); g.fill();
    g.shadowBlur = 0; g.strokeStyle = 'rgba(255,255,255,0.25)'; g.lineWidth = 2; rrect(-w / 2, -h / 2, w, h, h / 2); g.stroke();
    text(e.sub, 0, 2, e.subsize || 44, '#fff'); g.restore();
  }
};

// ---------------- schemes ----------------
function schemeBg(t, e, title) {
  const bg = g.createRadialGradient(W / 2, 700, 100, W / 2, 900, 1300);
  bg.addColorStop(0, '#24262c'); bg.addColorStop(1, '#0a0a0c'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,0.04)'; g.lineWidth = 2;
  for (let x = 0; x < W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  if (title) text(title, W / 2, 340, 40, 'rgba(255,255,255,0.6)', 'UE');
}
function wheel(x, y, r, ang) {
  g.save(); g.translate(x, y);
  g.fillStyle = '#15171b'; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
  const gr = g.createRadialGradient(-r * .2, -r * .3, 2, 0, 0, r * .62); gr.addColorStop(0, '#f2f4f7'); gr.addColorStop(1, '#5d636c');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r * .6, 0, 7); g.fill();
  g.rotate(ang); g.strokeStyle = '#2a2e34'; g.lineWidth = 7;
  for (let i = 0; i < 5; i++) { g.rotate(Math.PI * 2 / 5); g.beginPath(); g.moveTo(0, 0); g.lineTo(r * .55, 0); g.stroke(); }
  g.fillStyle = '#2a2e34'; g.beginPath(); g.arc(0, 0, r * .14, 0, 7); g.fill();
  g.restore();
}
function car(x, y, ang, wa, hot) {  // sedan side view, nose at +x (long hood, headlight), origin = ground contact centre
  g.save(); g.translate(x, y); g.rotate(ang);
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 30;
  const body = g.createLinearGradient(0, -175, 0, -30);
  body.addColorStop(0, '#eef1f4'); body.addColorStop(0.5, '#aab1ba'); body.addColorStop(1, '#58606a');
  g.fillStyle = body;
  const P = [[-180, -40], [-180, -98], [-150, -110], [-120, -114], [-85, -172], [30, -172], [80, -118], [165, -104], [180, -86], [180, -40]];
  g.beginPath(); P.forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py)); g.closePath(); g.fill(); g.shadowBlur = 0;
  g.fillStyle = 'rgba(30,40,55,0.85)';
  g.beginPath(); g.moveTo(-112, -118); g.lineTo(-80, -162); g.lineTo(-30, -162); g.lineTo(-30, -118); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-18, -118); g.lineTo(-18, -162); g.lineTo(26, -162); g.lineTo(66, -118); g.closePath(); g.fill();
  g.fillStyle = '#ffd36b'; g.shadowColor = '#ffd36b'; g.shadowBlur = 16; g.fillRect(166, -100, 13, 16); g.shadowBlur = 0;   // headlight
  g.fillStyle = RED; g.fillRect(-180, -100, 10, 18);                                                                         // tail light
  wheel(-112, -38, 40, wa); wheel(112, -38, 40, wa);
  if (hot > 0) {  // gearbox glow under the floor

}
function arrow(x0, y0, x1, y1, col, w = 12) {
  const a = Math.atan2(y1 - y0, x1 - x0);
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1 - Math.cos(a) * 20, y1 - Math.sin(a) * 20); g.stroke();
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - Math.cos(a - 0.5) * 40, y1 - Math.sin(a - 0.5) * 40);
  g.lineTo(x1 - Math.cos(a + 0.5) * 40, y1 - Math.sin(a + 0.5) * 40); g.closePath(); g.fill();

// garage on a steep ramp: car goes in nose-first (down), comes out in reverse (up) -> R pack loaded
D.garage = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const en = clamp((e.t1 - t) / 0.15), k = easeOut((t - e.t0) / 0.4);
  g.save(); schemeBg(t, e, 'ГАРАЖ КЛИЕНТА'); g.globalAlpha = en;
  // geometry: street level at top-right, ramp down to the garage at bottom-left
  const sx = 1080, sy = 640, rx0 = 760, ry0 = 640, rx1 = 260, ry1 = 980, gx = 60;
  const ang = Math.atan2(ry1 - ry0, rx1 - rx0); // ramp angle (pointing down-left)
  g.save(); g.translate(0, (1 - k) * 60); g.globalAlpha = en * k;
  // ground mass
  g.fillStyle = '#2c2f36';
  g.beginPath(); g.moveTo(sx, sy); g.lineTo(rx0, ry0); g.lineTo(rx1, ry1); g.lineTo(gx - 60, ry1); g.lineTo(gx - 60, 1120); g.lineTo(sx, 1120); g.closePath(); g.fill();
  g.strokeStyle = '#c3c8cf'; g.lineWidth = 8;
  g.beginPath(); g.moveTo(sx, sy); g.lineTo(rx0, ry0); g.lineTo(rx1, ry1); g.lineTo(gx - 60, ry1); g.stroke();
  // garage box
  g.fillStyle = 'rgba(255,255,255,0.06)'; g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(gx - 60, ry1); g.lineTo(gx - 60, ry1 - 300); g.lineTo(rx1 - 20, ry1 - 300); g.lineTo(rx1 - 20, ry1 - 230); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.12)'; for (let i = 0; i < 5; i++) g.fillRect(rx1 - 30, ry1 - 225 + i * 44, 14, 36);
  text('ГАРАЖ', gx + 50, ry1 - 340, 34, 'rgba(255,255,255,0.7)', 'UE');
  // slope angle marker
  g.strokeStyle = RED; g.lineWidth = 6; g.beginPath(); g.arc(rx0, ry0, 120, Math.PI, Math.PI + (Math.PI - Math.abs(ang)) * -1 + 0.0001, true); g.stroke();
  g.restore();
  const deg = Math.round(Math.abs(Math.atan2(ry1 - ry0, rx0 - rx1)) * 180 / Math.PI);
  if (t > e.t0 + 0.3) pop(`УКЛОН ${deg}°`, 620, 900, 40, RED, e.t0 + 0.3, t, 'UB', 8);
  // car path: phase A (t0..ta) street -> down the ramp nose first; phase B (ta..t1) reverse up

    const L1 = sx - 300 - rx0, L2 = Math.hypot(rx1 - rx0, ry1 - ry0), L3 = rx1 - (gx + 170), tot = L1 + L2 + L3;

    d -= L1; if (d < L2) { const q = d / L2; return [rx0 + (rx1 - rx0) * q, ry0 + (ry1 - ry0) * q, ang + Math.PI]; }

  if (t < ta) { s = easeInOut((t - e.t0 - 0.2) / (ta - e.t0 - 0.4)); dir = 1; }
  else { s = 1 - easeInOut((t - ta - 0.1) / (tb - ta - 0.4)); dir = -1; hot = clamp((t - ta) / 0.4); }
  let [x, y, a] = P(s);
  if (a > 3) a = a - Math.PI * 2; // keep the car upright facing left
  const shake = hot > 0 && s > 0.02 && s < 0.98 ? Math.sin(t * 70) * 3 : 0;
  // facing left: draw mirrored
  g.save(); g.translate(x, y + shake); g.scale(-1, 1); car(0, 0, -a, s * 40, hot * (s > 0.02 && s < 0.98 ? 1 : 0.4)); g.restore();
  if (t < ta) { if (t > e.t0 + 0.4) labelBox('ЗАЕЗД ПЕРЕДОМ', W / 2, 1200, e.t0 + 0.4, t, 46, '#2b2f36'); }
  else {
    labelBox('ВЫЕЗД ЗАДОМ', W / 2, 1200, ta + 0.05, t, 46);
    if (s > 0.05 && s < 0.95) { g.save(); g.globalAlpha = en * (0.6 + 0.4 * Math.sin(t * 20)); arrow(x - 70, y - 215, x - 70 + Math.cos(ang + Math.PI) * 170, y - 215 + Math.sin(ang + Math.PI) * 170, '#ffb02e', 14); g.restore(); }
    if (e.tr && t > e.tr) labelBox('НАГРУЗКА НА ПАКЕТ «R»', W / 2, 1330, e.tr, t, 38, '#ffb02e', '#111');

};
// vibration chart: vibration bars per gear, only up to 4th
D.gears = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const en = clamp((e.t1 - t) / 0.15);
  g.save(); schemeBg(t, e, e.title || 'ВИБРАЦИЯ ПРИ РАЗГОНЕ'); g.globalAlpha = en;
  const n = 6, x0 = 192, bw = 96, gap = 24, base = 1040;

    if (vib && t > e.t0 + 0.8) { g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 5; g.beginPath();
      for (let j = 0; j < 7; j++) { const yy = base - hgt - 40 - j * 0; g.lineTo(x + 10 + j * 15, yy + (j % 2 ? -16 : 16)); } g.stroke(); }
    text(String(i + 1), x + bw / 2, base + 60, 56, '#fff', 'UB');

// check-list card: rows appear one by one
D.checklist = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;

  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 8; g.fillStyle = 'rgba(14,14,16,0.88)'; rrect(x, y, w, h, 36); g.fill(); g.shadowBlur = 0;
  g.fillStyle = RED; rrect(x, y, 16, h, 8); g.fill();

    g.fillStyle = RED; g.beginPath(); g.arc(0, 0, 26, 0, 7); g.fill();
    text(String(i + 1), 0, 2, 30, '#fff', 'UB');
    g.restore();
    g.save(); g.globalAlpha = en * clamp((t - r[1]) / 0.15);

// oil drop leak: dripping drops + puddle (for leaks)
D.leak = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const en = clamp((e.t1 - t) / 0.12), lt = t - e.t0;

// planetary gear set: ring (internal teeth), sun, 3 planets on a carrier; worn -> shakes, red glow
function gearPath(x, y, r, n, ang, depth, inner) {
  g.beginPath();
  for (let i = 0; i <= n * 4; i++) {
    const a = ang + (i / (n * 4)) * Math.PI * 2, ph = i % 4;
    const rr = (ph === 0 || ph === 3) ? r : r + (inner ? -depth : depth);
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}
function metal(x, y, r) {
  const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y, r * 1.1);
  gr.addColorStop(0, '#f2f4f7'); gr.addColorStop(0.55, '#9aa1aa'); gr.addColorStop(1, '#3d434b'); return gr;
}
D.planet = (e, t) => {
  if (!inWin(t, e.t0, e.t1)) return;
  const lt = t - e.t0, en = clamp((e.t1 - t) / 0.15), k = easeOut(lt / 0.4);
  g.save(); schemeBg(t, e, e.title || 'ПЛАНЕТАРНЫЙ РЯД'); g.globalAlpha = en * k;
  const cx = W / 2, cy = 800, R = 300, wear = e.wt ? clamp((t - e.wt) / 0.5) : 0;
  const sh = wear ? Math.sin(t * 70) * 5 * wear : 0;
  g.translate(sh, (1 - k) * 60);
  const rot = lt * 0.9;
  // ring gear
  g.save(); g.shadowColor = 'rgba(0,0,0,0.7)'; g.shadowBlur = 40;
  g.beginPath(); g.arc(cx, cy, R + 60, 0, 7); gearPath(cx, cy, R, 48, -rot * 0.35, 18, true); g.fillStyle = metal(cx, cy, R + 60); g.fill('evenodd'); g.restore();

  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 26; g.beginPath(); g.arc(cx, cy, R * 0.6, 0, 7); g.stroke();

    const a = rot * 0.35 + i * Math.PI * 2 / 3, px = cx + Math.cos(a) * R * 0.6, py = cy + Math.sin(a) * R * 0.6;
    g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 20;
    gearPath(px, py, pr, 16, -rot * 1.6, 14, false); g.fillStyle = metal(px, py, pr); g.fill(); g.restore();
    g.fillStyle = '#2a2e34'; g.beginPath(); g.arc(px, py, pr * 0.28, 0, 7); g.fill();

      const rg = g.createRadialGradient(px, py, 5, px, py, pr * 1.2); rg.addColorStop(0, 'rgba(255,70,40,0.8)'); rg.addColorStop(1, 'rgba(255,40,20,0)');
      g.fillStyle = rg; g.beginPath(); g.arc(px, py, pr * 1.2, 0, 7); g.fill(); g.restore(); }
  }
  // sun
  g.save(); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 20;
  gearPath(cx, cy, R * 0.22, 14, rot * 2.4, 12, false); g.fillStyle = metal(cx, cy, R * 0.22); g.fill(); g.restore();
  g.fillStyle = '#c8ccd2'; g.beginPath(); g.arc(cx, cy, R * 0.07, 0, 7); g.fill();
  g.restore();
  if (e.wt && t > e.wt) { g.save(); g.globalAlpha = en; labelBox(e.label || 'ИЗНОС → ВИБРАЦИЯ', W / 2, 1300, e.wt, t, 44); g.restore(); }
};


// subscriber's question card (approved in DP0): frosted message card, avatar + «Вопрос подписчика»,
// words turn from grey to black as he reads them, key facts get a red marker, flies off on the flash.
// e: {t0, t1, words: [[t, word, key], ...]}; placed as low as the safe zone allows.
function qcardLayout(e) {
  const x = 50, w = 980, pad = 38, size = 32, lh = 44, maxW = w - pad * 2;
  g.font = `500 ${size}px Inter, -apple-system, Arial`;

  let cx = 0, line = 0; const items = [];
  for (const [t, wd, key] of e.words) {
    const ww = g.measureText(wd).width;

  }
  const head = 82, foot = 30, h = head + (line + 1) * lh + foot, y = 1680 - h;
  const sc = (930 - 150 - 40) / w;
  e._L = { x, y, w, h, pad, size, lh, head, items, sc, Y: 1420 - 20 - h * sc };
}
D.qcard = (e, t) => {
  const a = e.t0, b = e.t1; if (t < a || t >= b + 0.35) return;
  if (!e._L) qcardLayout(e);

  g.translate(W / 2, Y); g.scale(sc, sc); g.translate(-W / 2, -y);
  const s2 = 0.94 + 0.06 * kin; g.translate(W / 2, y + h / 2); g.scale(s2, s2); g.translate(-W / 2, -(y + h / 2));
  g.shadowColor = 'rgba(0,0,0,0.28)'; g.shadowBlur = 22; g.shadowOffsetY = 6;
  g.fillStyle = 'rgba(246,246,248,0.94)'; rrect(x, y, w, h, 36); g.fill();
  g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 2; rrect(x + 1, y + 1, w - 2, h - 2, 35); g.stroke();
  const av = g.createLinearGradient(x + pad, y + 18, x + pad + 46, y + 64); av.addColorStop(0, '#c9ccd3'); av.addColorStop(1, '#9ea3ad');
  g.fillStyle = av; g.beginPath(); g.arc(x + pad + 23, y + 44, 23, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(x + pad + 23, y + 37, 8, 0, 7); g.fill();
  g.beginPath(); g.ellipse(x + pad + 23, y + 58, 14, 9, 0, Math.PI, 0); g.fill();
  g.font = '600 28px Inter, -apple-system, Arial'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#1c1c1e';
  g.fillText('Вопрос подписчика', x + pad + 60, y + 45);
  g.font = `500 ${size}px Inter, -apple-system, Arial`;
  for (const it of items) {
    const px = x + pad + it.x, py = y + head + it.line * lh + lh / 2;
    const r = clamp((t - it.t + 0.04) / 0.16);
    if (it.key && r > 0) {
      const mk = easeOut((t - it.t) / 0.25);
      g.fillStyle = 'rgba(240,41,47,0.18)'; rrect(px - 5, py - 21, (it.w + 10) * mk, 42, 8); g.fill();
    }

    g.fillStyle = it.key && r > 0 ? `rgb(${Math.round(150 + 90 * r)},${Math.round(grey * (1 - r) + 30 * r)},${Math.round(grey * (1 - r) + 36 * r)})`
                                  : `rgb(${grey},${grey},${grey + 4})`;
    g.fillText(it.wd, px, py + 2);
  }
  g.restore();
};

// ---------- end plate ----------
function drawEnd(t) {
  const a = T.main; if (t < a) return;
  const lt = t - a;
  g.save(); const k = easeBack(lt / 0.45);
  g.translate(W / 2, 560); g.scale(k, k);
  g.shadowColor = 'rgba(240,41,47,0.45)'; g.shadowBlur = 40; g.drawImage(logo, -170, -170, 340, 340);
  g.restore();
  const lines = T.end_q;
  lines.forEach((s, i) => { g.font = '900 68px UB'; const fs = Math.min(68, Math.floor(68 * 600 / g.measureText(s).width));
    pop(s, W / 2, 850 + i * 94, fs, i === lines.length - 1 ? RED : '#fff', a + 0.25 + i * 0.12, t, 'UB', 10); });
  if (lt > 1.0) {
    const yb = 850 + (lines.length - 1) * 94 + 100;
    g.save(); g.globalAlpha = clamp((lt - 1.0) / 0.2);
    text('ПИШИТЕ В КОММЕНТАРИЯХ', W / 2, yb, 38, 'rgba(255,255,255,0.92)', 'UE');
    const bob = Math.sin(lt * 6) * 14; g.strokeStyle = RED; g.lineWidth = 12; g.lineCap = 'round'; g.lineJoin = 'round';
    for (let i = 0; i < 2; i++) { g.beginPath(); g.moveTo(W / 2 - 34, yb + 50 + i * 34 + bob * 0.6); g.lineTo(W / 2, yb + 80 + i * 34 + bob * 0.6); g.lineTo(W / 2 + 34, yb + 50 + i * 34 + bob * 0.6); g.stroke(); }
    g.restore();
  }
}

const ORDER = ['qcard', 'planet', 'garage', 'gears', 'leak', 'ellipse', 'brackets', 'counter', 'interval', 'checklist', 'question', 'header', 'label', 'address', 'meme', 'big3d'];
function drawFrame(t) {
  g.clearRect(0, 0, W, H);
  for (const ty of ORDER) for (const e of T.ev) if (e.type === ty) D[ty](e, t);
  drawEnd(t);
  for (const e of T.ev) if (e.type === 'flash') D.flash(e, t);
}
window.setup = async (tl) => { T = tl; logo.src = 'file://' + tl.logo;
  await document.fonts.load('900 40px UB'); await document.fonts.load('800 40px UE');
  if (!logo.complete) await new Promise(r => logo.onload = r); return true; };
window.frame = (i) => { drawFrame(i / T.fps); return c.toDataURL('image/png'); };
